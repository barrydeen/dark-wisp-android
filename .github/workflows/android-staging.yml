name: Android staging build

on:
  push:
    branches:
      - feature/deepl-translation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build staging APK
        run: ./gradlew --no-daemon testStagingUnitTest assembleStaging

      - name: Upload staging APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-wisp-deepl-staging
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error
